[General]
auto-profiles = yes

[Mapping positivo-speakers]
description = Alto-falantes internos
device-strings = hw:%f,0
channel-map = left,right
direction = output
priority = 100

[Mapping positivo-mic]
description = Microfone interno (Positivo)
device-strings = hw:%f,0
channel-map = left,right
direction = input
priority = 100

[Profile positivo-duplex]
description = Alto-falantes e microfone internos
output-mappings = positivo-speakers
input-mappings = positivo-mic
priority = 200
skip-probe = yes
