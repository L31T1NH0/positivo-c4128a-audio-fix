# Positivo C4128A-15: perfil PCM 0 e captura/reprodução sem suspensão automática.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*sof.*essx8336.*" } ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = false
        device.profile-set = "@HOME@/.config/positivo-audio/profile.conf"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.*sof.*essx8336.*positivo-speakers.*" } ]
    actions = {
      update-props = {
        node.description = "Alto-falantes internos (Positivo)"
        node.nick = "Alto-falantes internos"
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
  # Contorno validado nesta sessão: manter a captura aberta para evitar a reabertura.
  {
    matches = [ { node.name = "~alsa_input.*sof.*essx8336.*positivo-mic.*" } ]
    actions = {
      update-props = {
        node.description = "Microfone interno (Positivo)"
        node.nick = "Microfone interno"
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
